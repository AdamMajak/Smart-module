[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-module-fastapi"
version = "0.1.0"
description = "FastAPI submodule for Smart-module"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
